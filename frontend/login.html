<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #005bea, #00c6fb);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            color: #007bff;
        }
        button {
            width: 100%;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon mb-3">📚</div>
    <h3 class="mb-4">Library System</h3>
    <div class="mb-3">
        <input type="number" id="loginId" class="form-control" placeholder="Masukkan ID Anda">
    </div>
    <div class="mb-3">
        <input type="text" id="loginName" class="form-control" placeholder="Masukkan Nama Anda">
    </div>
    <button class="btn btn-primary mb-2" onclick="login()">Login</button>
    <p class="text-muted mt-2">Belum punya akun?</p>
    <a href="register.html"><button class="btn btn-outline-primary">Daftar Akun</button></a>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";

async function login() {
    const id = document.getElementById('loginId').value;
    const name = document.getElementById('loginName').value;

    if (!id || !name) {
        alert("ID dan Nama wajib diisi!");
        return;
    }

    try {
        const res = await fetch(`${API_URL}/users/${id}`, {
            headers: { "X-User-ID": 1 } // ambil data user pakai akses admin
        });

        if (!res.ok) {
            alert("User tidak ditemukan. Silakan daftar terlebih dahulu.");
            return;
        }

        const user = await res.json();

        // Validasi nama
        if (user.name.trim().toLowerCase() !== name.trim().toLowerCase()) {
            alert("Nama tidak sesuai dengan ID yang terdaftar!");
            return;
        }

        // Simpan session
        localStorage.setItem("USER_ID", user.id);
        localStorage.setItem("USER_NAME", user.name);
        localStorage.setItem("USER_ROLE", user.role);

        alert(`Login berhasil sebagai ${user.role}!`);
        window.location.href = "index.html";

    } catch (err) {
        alert("Gagal terhubung ke server backend!");
    }
}

// Jika sudah login, redirect ke index
if (localStorage.getItem("USER_ID")) {
    window.location.href = "index.html";
}
</script>



</body>
</html>
