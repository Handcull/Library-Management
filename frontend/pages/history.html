<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Riwayat Peminjaman - Library System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../app.js"></script>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="../index.html">📚 Library System</a>
    <span id="activeUser" class="text-white me-2"></span>
    <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container py-4">
  <h2 class="mb-3">📜 Riwayat Peminjaman</h2>
  <p class="text-muted">Daftar semua transaksi peminjaman buku.</p>

  <table class="table table-striped shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>Loan ID</th>
        <th>Buku</th>
        <th>Peminjam</th>
        <th>Pinjam → Tempo</th>
        <th>Status</th>
        <th>Denda</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="historyTableBody">
      <tr><td colspan="7" class="text-center">Memuat data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  loadHistory();

  async function loadHistory() {
    try {
      const endpoint = USER_ROLE === "admin" ? "/loans/history" : "/loans/history/me";
      const response = await apiRequest(endpoint);
      const tbody = document.getElementById("historyTableBody");
      tbody.innerHTML = "";

      if (!response.data || response.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">Belum ada riwayat peminjaman.</td></tr>`;
        return;
      }

      response.data.forEach(loan => {
        const statusBadge =
          loan.status.includes("Dikembalikan") ? `<span class="badge bg-success">${loan.status}</span>` :
          loan.status.includes("Telat") ? `<span class="badge bg-danger">${loan.status}</span>` :
          `<span class="badge bg-primary">${loan.status}</span>`;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${loan.loan_id}</td>
          <td>${loan.book}</td>
          <td>${loan.user}</td>
          <td>${loan.tanggal_pinjam} → ${loan.tanggal_jatuh_tempo}</td>
          <td>${statusBadge}</td>
          <td>${loan.denda}</td>
          <td>
            <button class="btn btn-sm btn-outline-info" onclick="viewDetail('${loan.loan_id}')">
              🔍 Detail
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });

    } catch (err) {
      alert("Gagal memuat riwayat: " + err.message);
    }
  }

  async function viewDetail(loanId) {
    try {
      const res = await apiRequest(`/loans/detail/${loanId}`);
      alert(
        `📖 DETAIL PINJAMAN\n\n` +
        `Loan ID: ${loanId}\n` +
        `Buku: ${res.data.book}\n` +
        `Peminjam: ${res.data.user}\n` +
        `Tanggal Pinjam: ${res.data.tanggal_pinjam}\n` +
        `Jatuh Tempo: ${res.data.tanggal_jatuh_tempo}\n` +
        `Status: ${res.data.status}\n` +
        `Denda: ${res.data.denda}\n`
      );
    } catch (err) {
      alert("Gagal melihat detail: " + err.message);
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
