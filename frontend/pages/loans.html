<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pinjaman Aktif - Library System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../app.js"></script>
</head>
<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="../index.html">📚 Library System</a>
    <span id="activeUser" class="text-white me-2"></span>
    <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container py-4">
  <h2 class="mb-3">📘 Pinjaman Aktif</h2>
  <p class="text-muted">Daftar buku yang sedang dipinjam.</p>

  <table class="table table-striped shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>Loan ID</th>
        <th>Judul Buku</th>
        <th>Jatuh Tempo</th>
        <th>Status</th>
        <th style="width: 140px;">Aksi</th>
      </tr>
    </thead>
    <tbody id="loanTableBody">
      <tr><td colspan="5" class="text-center">Memuat data...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // Proteksi: wajib login
  if (!USER_ID) {
    window.location.href = "../login.html";
  }

  // Load Pinjaman Aktif
  loadActiveLoans();

  async function loadActiveLoans() {
    try {
      const response = await apiRequest("/loans/active");
      const tbody = document.getElementById("loanTableBody");
      tbody.innerHTML = "";

      if (!response.data || response.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Belum ada pinjaman aktif.</td></tr>`;
        return;
      }

      response.data.forEach(loan => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${loan.loan_id}</td>
          <td>${loan.book}</td>
          <td>${loan.tanggal_jatuh_tempo}</td>
          <td>${loan.status}</td>
          <td>
            <div class="dropdown">
              <button class="btn btn-sm btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
                Aksi
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item text-primary" onclick="extendLoan('${loan.loan_id}')">🔁 Perpanjang</a></li>
                <li><a class="dropdown-item text-success" onclick="returnBook('${loan.loan_id}')">✅ Kembalikan</a></li>
                <li><a class="dropdown-item text-info" onclick="viewDetail('${loan.loan_id}')">🔍 Detail</a></li>
              </ul>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });

    } catch (err) {
      alert("Gagal memuat data pinjaman: " + err.message);
    }
  }

  async function extendLoan(loanId) {
    if (!confirm("Perpanjang masa pinjam 7 hari?")) return;
    try {
      const res = await apiRequest(`/extend/${loanId}`, "POST");
      alert(res.message);
      loadActiveLoans();
    } catch (err) {
      alert("Gagal perpanjang: " + err.message);
    }
  }

  async function returnBook(loanId) {
    if (!confirm("Yakin ingin mengembalikan buku ini?")) return;
    try {
      const res = await apiRequest(`/return/${loanId}`, "POST");
      alert(res.message + " | Denda: " + res.data?.denda ?? "Rp 0");
      loadActiveLoans();
    } catch (err) {
      alert("Gagal mengembalikan: " + err.message);
    }
  }

  async function viewDetail(loanId) {
    try {
      const res = await apiRequest(`/loans/detail/${loanId}`, "GET");
      alert(
        `📘 DETAIL PINJAMAN\n\n` +
        `Loan ID: ${loanId}\n` +
        `Buku: ${res.data.book}\n` +
        `Tanggal Pinjam: ${res.data.tanggal_pinjam}\n` +
        `Jatuh Tempo: ${res.data.tanggal_jatuh_tempo}\n` +
        `Status: ${res.data.status}\n` +
        `Denda: ${res.data.denda}`
      );
    } catch (err) {
      alert("Gagal melihat detail: " + err.message);
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
