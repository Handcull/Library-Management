<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Library System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #005bea, #00c6fb);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .register-card {
            width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            color: #007bff;
        }
        button {
            width: 100%;
        }
        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="icon mb-3">📝</div>
    <h3 class="mb-4">Daftar Akun Baru</h3>
    <div class="mb-3">
        <input type="text" id="regName" class="form-control" placeholder="Masukkan Nama Anda">
    </div>
    <button class="btn btn-success mb-3" onclick="register()">Daftar</button>
    <a href="login.html"><button class="btn btn-outline-primary">Sudah punya akun? Login</button></a>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";

async function register() {
    const name = document.getElementById('regName').value;
    if (!name) {
        alert("Nama tidak boleh kosong!");
        return;
    }

    const body = { name: name, role: "mahasiswa" };

    try {
        const res = await fetch(`${API_URL}/users`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-User-ID": 1 }, // Register diijinkan hanya oleh admin sementara
            body: JSON.stringify(body)
        });

        if (!res.ok) {
            const err = await res.json();
            alert("Gagal daftar: " + (err.detail || "Unknown error"));
            return;
        }

        const data = await res.json();
        alert(`Pendaftaran berhasil! ID Anda: ${data.data.id}`);
        window.location.href = "login.html";

    } catch (error) {
        alert("Gagal konek ke server backend.");
    }
}
// Kalau sudah login, jangan bisa buka register
if (localStorage.getItem("USER_ID")) {
    window.location.href = "index.html";
}

</script>

</body>
</html>
