<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">📚 Library System</a>
    <span id="activeUser" class="text-white me-2"></span>
    <button class="btn btn-warning btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>



<header class="py-5 text-center bg-white shadow-sm mb-4">
  <h1 class="fw-bold text-primary">Sistem Peminjaman Buku</h1>
  <p class="text-muted">Selamat datang di perpustakaan digital</p>
</header>

<main class="container">
  <div class="text-center mb-4">
    <button onclick="location.href='pages/loans.html'" class="btn btn-outline-primary">📘 Pinjaman Aktif</button>
    <button onclick="location.href='pages/history.html'" class="btn btn-outline-secondary">📜 Riwayat</button>
    <button onclick="location.href='pages/simulate.html'" class="btn btn-outline-success">💰 Simulasi Denda</button>
    <button onclick="location.href='pages/users.html'" class="btn btn-outline-dark">👤 Kelola User</button>
</div>


  <h2 class="mb-3">📚 Daftar Buku</h2>
  <div id="bookList" class="row"></div> <!-- daftar buku muncul di sini -->
</main>

<!-- Modal User Selector -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Pilih Pengguna</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <p>Pilih mode pengguna untuk mengakses sistem.</p>
        <button class="btn btn-primary w-100 mb-2" onclick="setUser(101)" data-bs-dismiss="modal">Masuk sebagai Mahasiswa</button>
        <button class="btn btn-danger w-100" onclick="setUser(1)" data-bs-dismiss="modal">Masuk sebagai Admin</button>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 mt-5 bg-white shadow-sm">
  <small>© Sistem Perpustakaan 2025</small>
</footer>

</body>
</html>
